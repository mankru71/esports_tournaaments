{% extends request.is_htmx|yesno:"base_partial.html,base.html" %}
{% block title %}Умный Скаутинг{% endblock %}
{% block content %}
<style>
  .tinder-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    position: relative;
    max-width: 400px;
    margin: 0 auto;
    text-align: center;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .tinder-card.swiping-left {
    transform: translateX(-100px) rotate(-10deg);
    opacity: 0;
  }
  .tinder-card.swiping-right {
    transform: translateX(100px) rotate(10deg);
    opacity: 0;
  }
  .tinder-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 1rem;
    border: 3px solid var(--accent);
  }
  .tinder-avatar-placeholder {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--muted);
    margin: 0 auto 1rem auto;
    border: 3px solid var(--accent);
  }
  .tinder-controls {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 2rem;
  }
  .tinder-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid;
    background: var(--surface);
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .tinder-btn:hover {
    transform: scale(1.1);
  }
  .btn-skip {
    border-color: var(--danger);
    color: var(--danger);
  }
  .btn-skip:hover {
    background: rgba(220, 53, 69, 0.1);
  }
  .btn-invite {
    border-color: var(--success);
    color: var(--success);
  }
  .btn-invite:hover {
    background: rgba(40, 167, 69, 0.1);
  }
</style>

<div class="container py-5">
  <div class="text-center mb-5">
    <h1 class="fw-bold">Поиск игроков</h1>
    <p class="text-muted">Подходящие кандидаты для вашей команды</p>
  </div>

  <div id="scouting-container">
    {% include "partials/scouting_card.html" %}
  </div>
</div>
{% endblock %}
