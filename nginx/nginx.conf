# ============================================================
# nginx.conf — Arena Control reverse proxy
# FIXED: added upstream keepalive, proper timeouts, and Gunicorn fixes
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Щедро выделяем таймауты — бэкендам может понадобиться время на холодный старт
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    # ── Upstreams (Пул постоянных соединений для защиты от 502 ошибок) ──
    upstream django {
        server django-app:8000;
        keepalive 32;
    }

    upstream backend {
        server csharp-api:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Static files (served directly from the shared volume) ──────
        location /static/ {
            alias /static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── Media uploads ───────────────────────────────────────────────
        location /media/ {
            alias /media/;
            expires 7d;
        }

        # ── C# API ──────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection ""; # Очищаем заголовок для keepalive
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── SignalR WebSocket ────────────────────────────────────────────
        location /hubs/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade"; # Для вебсокетов это обязательно!
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Django frontend (catch-all) ──────────────────────────────────
        location / {
            proxy_pass         http://django;
            proxy_http_version 1.1;
            proxy_set_header   Connection ""; # Очищаем заголовок для keepalive
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off; # Отключаем буферизацию, чтобы Gunicorn отдавал ответ сразу
        }
    }
}