# ============================================================
# nginx.conf — Arena Control reverse proxy
# FIXED: added mime.types, static/media blocks, safe timeouts
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;   # ← FIX: was missing; without this CSS/JS served as text/plain
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Generous upstream timeouts — backend may be slow to cold-start
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    server {
        listen 80;
        server_name _;

        # ── Static files (served directly from the shared volume) ──────
        location /static/ {
            alias /static/;
            expires 1d;
            add_header Cache-Control "public";
        }

        # ── Media uploads ───────────────────────────────────────────────
        location /media/ {
            alias /media/;
            expires 7d;
        }

        # ── C# API ──────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://csharp-api:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── SignalR WebSocket ────────────────────────────────────────────
        location /hubs/ {
            proxy_pass         http://csharp-api:5000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Django frontend (catch-all) ──────────────────────────────────
        location / {
            proxy_pass         http://django-app:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
